name: geoapp
description: Crowd forecast for places near you — Google Maps + Places with an OpenStreetMap fallback.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  # drift 2.35+ needs analyzer/meta newer than this Flutter SDK pins.
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.6
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  fl_chart: ^1.2.0
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.10
  intl: ^0.20.3
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_map: ^8.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/geoapp_logo.png
    - assets/geoapp_splash.png
    - assets/seed/
    - assets/map_styles/
  fonts:
    # Poppins (SIL Open Font License, see assets/fonts/OFL.txt).
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
